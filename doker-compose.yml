version: '3.8'

services:
  app:
    build: .
    container_name: apotik-app
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      - CI_ENVIRONMENT=production
      - database.default.hostname=db
      - database.default.database=apotik
      - database.default.username=root
      - database.default.password=root123

  db:
    image: mysql:8.0
    container_name: apotik-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: apotik
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
